services:
  # Web Application Service
  - type: web
    name: ticketflow-app
    env: node
    plan: free
    buildCommand: "npm run build:all"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ticketflow-redis
          property: connectionString

databases:
  # Managed PostgreSQL
  - name: ticketflow-postgres
    plan: free
    databaseName: ticketflow_db
    user: ticketflow_user

  # Managed Redis Cache
  - name: ticketflow-redis
    plan: free
