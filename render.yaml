services:
  - type: web
    name: ticketflow-app
    env: node
    plan: free
    buildCommand: "npm run build:all"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflow-postgres
          property: connectionString

databases:
  - name: ticketflow-postgres
    plan: free
    databaseName: ticketflow_db
    user: ticketflow_user
